name: Test

on:
  push:
  pull_request:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs

  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
      - shell: bash
        run: |
          expected=$(awk -F '|' '$1 == "latest" { print $2 }' manifest.txt)
          test "$(ngit --version)" = "ngit $expected"
          command -v git-remote-nostr

  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: setup
        uses: ./
        with:
          version: 2.6.3
      - shell: bash
        run: |
          test "$(ngit --version)" = 'ngit 2.6.3'
          test '${{ steps.setup.outputs.version }}' = '2.6.3'
