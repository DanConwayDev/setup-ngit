name: Setup ngit
description: >-
  Install ngit and git-remote-nostr from a pinned, checksum-verified release
  manifest. Works on GitHub-hosted runners and in act-based runners such as
  ngit-ci.
branding:
  icon: git-branch
  color: purple

inputs:
  version:
    description: >-
      ngit version to install (e.g. "2.6.3"), or "latest" for the newest
      version pinned in this action's manifest.
    required: false
    default: latest

outputs:
  version:
    description: The ngit version that was installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        NGIT_SETUP_VERSION: ${{ inputs.version }}
      run: '"$GITHUB_ACTION_PATH/scripts/install.sh"'
